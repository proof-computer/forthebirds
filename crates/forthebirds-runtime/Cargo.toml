[package]
name = "forthebirds-runtime"
description = "Grammar-constrained activation loop for swarms"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
forthebirds-inference = { path = "../forthebirds-inference" }
serde = { version = "1", features = ["derive"] }

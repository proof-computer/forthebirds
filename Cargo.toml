[workspace]
resolver = "3"
members = ["crates/*", "vendor/rouchdb-adapter-redb"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/proof-computer/forthebirds"

[workspace.lints.rust]
unsafe_code = "forbid"

[patch.crates-io]
rouchdb-adapter-redb = { path = "vendor/rouchdb-adapter-redb" }
